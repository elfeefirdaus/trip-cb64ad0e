 bg.querySelector('#f_save').onclick=function(){var t=bg.querySelector('#f_title').value.trim();if(!t){toast('Add what you\'re doing');return}
  var nd=bg.querySelector('#f_day').value,o={id:a.id||uid(),time:bg.querySelector('#f_time').value,title:t,place:bg.querySelector('#f_place').value.trim(),note:bg.querySelector('#f_note').value.trim()};if(a.src)o.src=a.src;var base=geo&&o.place===geo.place?geo:(a.id?a:pre);if(base&&o.place===(base.place||'')){['kw','lat','lng','coord','nomap'].forEach(function(f){if(base[f]!=null)o[f]=base[f]})}
  if(a.id){TRIP_DAYS.forEach(function(d){S.days[d]=S.days[d].filter(function(x){return x.id!==a.id})})}
  S.days[nd].push(o);save();closeSheet();if(view.tab==='plan')view.day=nd;render();toast(a.id?'Updated':'Added to '+dLabel(nd))};
}
function daySheet(s){
 var bg=sheet('<h3>Add “'+esc(s.en)+'” to…</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+TRIP_DAYS.map(function(d,i){return '<button class="day" style="width:auto;background:var(--tile)" data-pick="'+d+'"><small>Day '+(i+1)+'</small><b>'+dObj(d).getUTCDate()+'</b><small>'+WD[dObj(d).getUTCDay()]+'</small></button>'}).join('')+'</div><button class="btn ghost sm" id="pk_more">Add with a time and note…</button>');
 bg.querySelectorAll('[data-pick]').forEach(function(b){b.onclick=function(){var d=b.dataset.pick;var o=itemFromPlace(s);o.id=uid();o.time='';S.days[d].push(o);save();closeSheet();keepY(function(){});toast('Added to '+dLabel(d))}});
 bg.querySelector('#pk_more').onclick=function(){actForm(TRIP_DAYS[1],null,itemFromPlace(s))}}
function findAct(k,id){return (S.days[k]||[]).filter(function(x){return x.id===id})[0]}
function wxForm(){var w=S.weather||{};var bg=sheet('<h3>Weather note</h3><div class="two"><div class="fld"><label>Temperature</label><input id="w_t" value="'+esc(w.temp)+'" placeholder="e.g. 9–15°C"></div><div class="fld"><label>Conditions</label><input id="w_c" value="'+esc(w.cond)+'" placeholder="e.g. Cloudy"></div></div><div class="fld"><label>Note</label><input id="w_n" value="'+esc(w.note)+'" placeholder="e.g. Rain on Tuesday"></div><button class="btn" id="w_s">Save</button><button class="btn ghost sm" id="w_x">Clear</button>');
 bg.querySelector('#w_s').onclick=function(){S.weather={temp:bg.querySelector('#w_t').value.trim(),cond:bg.querySelector('#w_c').value.trim(),note:bg.querySelector('#w_n').value.trim()};save();closeSheet();render()};
 bg.querySelector('#w_x').onclick=function(){S.weather={temp:'',cond:'',note:''};save();closeSheet();render()}}
function full(z1,z2,en,py){var d=document.createElement('div');d.className='full';d.innerHTML='<div class="z1 zh">'+esc(z1)+'</div>'+(z2?'<div class="z2 zh">'+esc(z2)+'</div>':'')+(py?'<div class="fpy">'+esc(py)+'</div>':'')+'<div class="en">'+esc(en)+'</div><button>Close</button>';d.onclick=function(){d.remove()};document.body.appendChild(d)}
function keepY(fn){var y=scrollY;fn();render();scrollTo(0,y)}

document.addEventListener('click',function(e){
 var t=e.target.closest('button,[data-go],[data-fz]');if(!t||t.closest('#sheet .sheet [data-pick]'))return;var ds=t.dataset;
 if(ds.tab){view.tab=ds.tab;render();scrollTo(0,0);return}
 if(ds.go){view.tab=ds.go;if(ds.day)view.day=ds.day;if(ds.ess)view.ess=ds.ess;render();var an=ds.anchor||(ds.ess?'e_'+ds.ess:null),el=an&&document.getElementById(an);if(el)scrollTo(0,el.getBoundingClientRect().top+scrollY-(ds.ess?56:8));else scrollTo(0,0);return}
 if(ds.ess&&view.tab==='ess'){view.ess=ds.ess;document.querySelectorAll('.subnav .chip').forEach(function(c){c.classList.toggle('on',c.dataset.ess===ds.ess)});var el2=document.getElementById('e_'+ds.ess);if(el2)scrollTo({top:el2.getBoundingClientRect().top+scrollY-56,behavior:'smooth'});return}
 if(ds.day&&t.classList.contains('day')){view.day=ds.day;render();return}
 if(ds.act==='add'){actForm(ds.day);return}
 if(ds.edit){var a=findAct(ds.day,ds.edit);if(a)actForm(ds.day,a);return}
 if(ds.del){var a2=findAct(ds.day,ds.del);if(a2&&confirm('Delete "'+a2.title+'"?')){keepY(function(){S.days[ds.day]=S.days[ds.day].filter(function(x){return x.id!==ds.del});save()});toast('Deleted')}return}
 if(ds.cat){view.cat=ds.cat;render();return}
 if(ds.addspot){var s=placeById(ds.addspot);if(!s)return;daySheet(s);return}
 if(ds.copyzh){var s2=placeById(ds.copyzh);copy(s2.zh.split(' · ')[0]);return}
 if(ds.act==='savegm'){var inp2=document.getElementById('gm_url'),raw=inp2&&inp2.value.trim();if(!raw)return;var isUrl=/^https?:\/\//i.test(raw),g=isUrl?parseGmaps(raw):{name:raw,lat:null,lng:null};
  var bg2=sheet('<h3>Save place</h3>'+(g.short?'<div class="note" style="margin:0 0 12px">Short goo.gl links hide the location. Type the name below and Amap will search for it, or open the link and copy the full URL from the address bar.</div>':'')+'<div class="fld"><label>Name</label><input id="p_name" value="'+esc(g.name)+'" placeholder="Place name"></div><div class="fld"><label>Chinese name (optional, best for Amap search)</label><input id="p_zh" class="zh" placeholder="e.g. 外滩"></div><div class="tiny" style="margin:-4px 4px 12px">'+(g.lat!=null?'Pinned at '+g.lat.toFixed(5)+', '+g.lng.toFixed(5)+' from the link.':'No coordinates found, so Amap will search by name.')+'</div><button class="btn" id="p_save">Save place</button>');
  bg2.querySelector('#p_save').onclick=function(){var nm=bg2.querySelector('#p_name').value.trim(),zh=bg2.querySelector('#p_zh').value.trim();if(!nm&&!zh){toast('Add a name');return}
   var p={id:'p_'+uid(),name:nm||zh,zh:zh,src:isUrl?'google':'typed'};if(g.lat!=null){p.lat=g.lat;p.lng=g.lng;p.coord='gaode'}S.places.unshift(p);save();closeSheet();view.cat='Saved';render();toast('Place saved')};return}
 if(ds.rmplace){if(confirm('Remove this saved place?')){keepY(function(){S.places=S.places.filter(function(x){return x.id!==ds.rmplace});save()})}return}
 if(ds.copytxt){copy(ds.copytxt);return}
 if(ds.reveal){view.reveal[ds.reveal]=!view.reveal[ds.reveal];var inp=document.querySelector('input[data-ref="'+ds.reveal+'"]');if(inp)inp.type=view.reveal[ds.reveal]?'text':'password';return}
 if(ds.copyref){copy(S.refs[ds.copyref]);return}
 if(ds.transfer){keepY(function(){S.transfer=ds.transfer;save()});return}
 if(ds.act==='wx'){wxForm();return}
 if(ds.act==='full'){full('上海徐家汇中心安达仕酒店','上海市徐汇区虹桥路283号','Andaz Shanghai ITC · 283 Hongqiao Road, Xuhui · 请带我去这里');return}
 if(ds.fz!=null){full(ds.fz,'',ds.fe,ds.fp);return}
 if(ds.bt){var b=view.bt;if(ds.bt==='tops'){var ix=b.tops.indexOf(ds.v);if(ix>=0)b.tops.splice(ix,1);else b.tops.push(ds.v)}else if(ds.bt==='go'&&b.go===ds.v){b.go=''}else b[ds.bt]=ds.v;var bx=document.getElementById('bt_box');if(bx)bx.innerHTML=btBox();return}
 if(ds.osmsave!=null){var r0=OSMR[+ds.osmsave];if(r0){S.places.unshift({id:'p_'+uid(),name:r0.en,zh:r0.zh,lat:r0.lat,lng:r0.lng,coord:'wgs84',src:'osm',note:r0.area});save();toast('Saved to your places');t.textContent='Saved';t.disabled=true}return}
 if(ds.osmadd!=null){var r1=OSMR[+ds.osmadd];if(r1)daySheet(r1);return}
 if(ds.osmname!=null){S.places.unshift({id:'p_'+uid(),name:ds.osmname,zh:/[\u4e00-\u9fff]/.test(ds.osmname)?ds.osmname:'',src:'typed'});save();view.cat='Saved';view.osmq='';view.osmHtml='';render();toast('Place saved');return}
 if(ds.tog){keepY(function(){var it=S[ds.tog].filter(function(x){return x.id===ds.id})[0];if(it){it.done=!it.done;save()}});return}
 if(ds.rm){keepY(function(){S[ds.rm]=S[ds.rm].filter(function(x){return x.id!==ds.id});save()});return}
 if(ds.additem){var ip=document.getElementById('add_'+ds.additem),v=ip&&ip.value.trim();if(!v)return;keepY(function(){S[ds.additem].push({id:uid(),t:v,done:false});save()});var n=document.getElementById('add_'+ds.additem);if(n)n.focus({preventScroll:true});return}
 if(ds.theme||ds.accent){if(ds.theme)S.appearance.theme=ds.theme;if(ds.accent)S.appearance.accent=ds.accent;save();window.__shTheme.apply(S.appearance);render();toast('Appearance updated');return}
 if(ds.act==='export'){var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='Shanghai-trip-backup-'+todayKey()+'.json';document.body.appendChild(l);l.click();setTimeout(function(){URL.revokeObjectURL(u);l.remove()},1500);toast('Backup downloaded');return}
 if(ds.act==='reset'){if(confirm('Reset all trip data on this phone? Your theme stays.')){var ap=S.appearance;S=seed();S.appearance=ap;save();render();toast('Reset')}return}
});
document.addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('tap')){e.preventDefault();e.target.click();return}if(e.key==='Enter'&&e.target.id==='gm_url'){var gb=document.querySelector('[data-act=savegm]');if(gb)gb.click();return}if(e.key==='Enter'&&e.target.id&&e.target.id.indexOf('add_')===0){var b=document.querySelector('[data-additem="'+e.target.id.slice(4)+'"]');if(b)b.click()}});
document.addEventListener('input',function(e){var t=e.target;
 if(t.dataset.ref){S.refs[t.dataset.ref]=t.value.trim();save();return}
 if(t.id==='osm_q'){view.osmq=t.value;osmSearch(t.value,function(err,list,q){OSMR=list;view.osmHtml=osmResultsHtml(err,list,q);var box=document.getElementById('osm_res');if(box)box.innerHTML=view.osmHtml});return}
 if(t.id==='q'){view.q=t.value;var pos=t.selectionStart;render();var q=document.getElementById('q');q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}return}
 if(t.id==='accCustom'){S.appearance.accent=t.value;window.__shTheme.apply(S.appearance);return}
 if(t.id==='rate'){S.rate=parseFloat(t.value)||'';save();document.getElementById('dailyOut').textContent=dailyOut();return}
 if(t.id==='c_sgd'){var r=+S.rate;document.getElementById('c_cny').value=t.value&&r?(t.value*r).toFixed(2):'';return}
 if(t.id==='c_cny'){var r2=+S.rate;document.getElementById('c_sgd').value=t.value&&r2?(t.value/r2).toFixed(2):'';return}
 if(t.id==='daily'){S.dailyCny=t.value;save();document.getElementById('dailyOut').textContent=dailyOut();return}
 if(t.id==='nm'){S.name=t.value.trim()||'Fee';save();return}
});
document.addEventListener('change',function(e){var t=e.target;
 if(t.id==='accCustom'){S.appearance.accent=t.value;save();window.__shTheme.apply(S.appearance);render();return}
 if(t.id==='rate'){keepY(function(){});return}
 if(t.id==='imp'){var f=t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{var o=JSON.parse(rd.result);if(!o||!o.days)throw 0;S=o;save();load();window.__shTheme.apply(S.appearance);render();toast('Backup restored')}catch(_){toast('That file isn\'t a trip backup')}};rd.readAsText(f)}
});
load();window.__shTheme.apply(S.appearance);render();
window.__sh={get:function(){return S},view:view};
})();
